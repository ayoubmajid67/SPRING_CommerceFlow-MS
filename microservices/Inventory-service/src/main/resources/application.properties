spring.application.name=inventory-service

spring.jpa.hibernate.ddl-auto=update


spring.datasource.url=jdbc:mysql://localhost:3307/inventory_service
spring.datasource.username=inventory_user
spring.datasource.password=inventory_pass


server.port=8082

# =====================================================
# Eureka Client Configuration
# =====================================================

# URL of the Eureka Server where this service will register itself.
# The service will send heartbeats to this server to indicate it's alive.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Use IP address instead of hostname when registering with Eureka.
# Recommended for Docker/container environments and cross-network communication.
eureka.instance.prefer-ip-address=true


management.endpoints.web.exposure.include=health,info,metrics,loggers,mappings
management.endpoint.health.show-details=always

# enable Spring Cloud LoadBalancer for inter-service communication
spring.cloud.loadbalancer.enabled=true
