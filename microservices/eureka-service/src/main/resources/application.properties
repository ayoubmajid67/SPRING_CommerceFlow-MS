# =====================================================
# Eureka Server Configuration
# =====================================================

# Logical name of the application in the Spring ecosystem.
# Used for identification, logging, and configuration purposes.
spring.application.name=eureka-service

# Port where the Eureka Server will run.
# 8761 is the default and recommended port for Eureka Dashboard.
server.port=8761

# -----------------------------------------------------
# Eureka Client Settings (Disabled for Eureka Server)
# -----------------------------------------------------

# Prevents the Eureka Server from registering itself
# as a client in the registry.
# Required because the server does not need to discover itself.
eureka.client.register-with-eureka=false

# Prevents the Eureka Server from fetching the registry
# from another Eureka Server.
# This is correct for a single-node (standalone) Eureka setup.
eureka.client.fetch-registry=false

# -----------------------------------------------------
# Eureka Server Behavior
# -----------------------------------------------------

# Time (in milliseconds) that Eureka waits at startup
# before accepting requests when the registry is empty.
# Setting this to 0 removes the default startup delay,
# which is ideal for local development.
eureka.server.wait-time-in-ms-when-sync-empty=0
