spring.application.name=gateway-service
server.port=9000
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9001/realms/spring-microservices-security-realm

# http://localhost:8181/realms/spring-microservices-security-realm

# ==========================================
# SpringDoc OpenAPI Configuration
# ==========================================
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Aggregate API docs from all microservices
# These URLs are served by Routes.java using RestTemplate
springdoc.swagger-ui.urls[0].name=Product Service
springdoc.swagger-ui.urls[0].url=/aggregate/product/v3/api-docs

springdoc.swagger-ui.urls[1].name=Order Service
springdoc.swagger-ui.urls[1].url=/aggregate/order/v3/api-docs

springdoc.swagger-ui.urls[2].name=Inventory Service
springdoc.swagger-ui.urls[2].url=/aggregate/inventory/v3/api-docs

# =====================================================
# Eureka Client Configuration
# =====================================================

# URL of the Eureka Server where this service will register itself.
# The gateway registers with Eureka to enable service discovery routing.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Use IP address instead of hostname when registering with Eureka.
# Recommended for Docker/container environments and cross-network communication.
eureka.instance.prefer-ip-address=true



# Actuator Endpoints :
# Exposes all Actuator endpoints over HTTP (Web).

management.endpoints.web.exposure.include=*
# Shows full details of the health check (including nested components like db, diskSpace, circuitBreakers).
management.endpoint.health.show-details=always




# Circuit Breaker Health Indicator :
# Registers the circuit breaker health indicator with Spring Boot Actuator.
resilience4j.circuitbreaker.configs.default.register-health-indicator=true

# Enables the circuit breaker health indicator to be shown in the health endpoint.
#management.health.circuitbreakers.enabled=true

# Define named circuit breaker instances (must match the names used in code)
resilience4j.circuitbreaker.instances.product-serviceCircuitBreaker.baseConfig=default
resilience4j.circuitbreaker.instances.order-serviceCircuitBreaker.baseConfig=default
resilience4j.circuitbreaker.instances.inventory-serviceCircuitBreaker.baseConfig=default


# Resilience4j Properties :
# Sets the sliding window type to COUNT_BASED (records the outcome of the last N calls).
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
# The size of the sliding window (number of calls to record).
resilience4j.circuitbreaker.configs.default.sliding-window-size=10 
# The failure rate threshold in percentage. If 50% of calls fail, the circuit opens.
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50 
# The time to wait before transitioning from OPEN to HALF_OPEN state.
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=5s
# The number of permitted calls when the circuit is in HALF_OPEN state.
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
# Automatically transitions to HALF_OPEN state after the wait duration, without waiting for a call.
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true 

# circuit breaker by default will start evaluate the rate-threshold till arrives the windows size of 10
# so we don't want that we want it to start considering the record from 5
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5

# Resilience4j Timeout Properties:
# Limits how long your service waits for a response from another service.
resilience4j.timelimiter.configs.default.timeout-duration=100s

# Resilience4j Retry Properties:
# how many time res will retry to resend the request to the target service. after failing :
resilience4j.retry.configs.default.max-attempts=3
# the delay time between retries.
resilience4j.retry.configs.default.wait-duration=2s

# The time to wait for a permission before timing out.
resilience4j.ratelimiter.configs.default.limitRefreshPeriod=10s
# number of requests allowed within the limitRefreshPeriod.
resilience4j.ratelimiter.configs.default.limitForPeriod=3

