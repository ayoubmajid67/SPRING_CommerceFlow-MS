spring.application.name=gateway-service
server.port=9000
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9001/realms/spring-microservices-security-realm

# http://localhost:8181/realms/spring-microservices-security-realm

# ==========================================
# SpringDoc OpenAPI Configuration
# ==========================================
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Aggregate API docs from all microservices
# These URLs are served by Routes.java using RestTemplate
springdoc.swagger-ui.urls[0].name=Product Service
springdoc.swagger-ui.urls[0].url=/aggregate/product/v3/api-docs

springdoc.swagger-ui.urls[1].name=Order Service
springdoc.swagger-ui.urls[1].url=/aggregate/order/v3/api-docs

springdoc.swagger-ui.urls[2].name=Inventory Service
springdoc.swagger-ui.urls[2].url=/aggregate/inventory/v3/api-docs

# =====================================================
# Eureka Client Configuration
# =====================================================

# URL of the Eureka Server where this service will register itself.
# The gateway registers with Eureka to enable service discovery routing.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Use IP address instead of hostname when registering with Eureka.
# Recommended for Docker/container environments and cross-network communication.
eureka.instance.prefer-ip-address=true


management.endpoints.web.exposure.include=health,info,metrics,loggers,mappings
management.endpoint.health.show-details=always

