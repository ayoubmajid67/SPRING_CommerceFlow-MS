spring.application.name=order-service

# Let Hibernate manage the database schema for development.
# It will create or update tables based on your @Entity classes.
spring.jpa.hibernate.ddl-auto=none


spring.datasource.url=jdbc:mysql://localhost:3306/order_service
spring.datasource.username=root
spring.datasource.password=mysql

server.port=8081
inventory.url=http://localhost:8082/api/inventory/
inventory.basepath=/api/inventory/
inventory.serverPort=8082
inventory.serverHost=localhost

# =====================================================
# Eureka Client Configuration
# =====================================================

# URL of the Eureka Server where this service will register itself.
# The service will send heartbeats to this server to indicate it's alive.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Use IP address instead of hostname when registering with Eureka.
# Recommended for Docker/container environments and cross-network communication.
eureka.instance.prefer-ip-address=true


management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always


# Circuit Breaker Health Indicator :
# Registers the circuit breaker health indicator with Spring Boot Actuator.
resilience4j.circuitbreaker.instances.default.register-health-indicator=true

# Resilience4j Properties :
# Sets the sliding window type to COUNT_BASED (records the outcome of the last N calls).
resilience4j.circuitbreaker.instances.inventory.sliding-window-type=COUNT_BASED
# The size of the sliding window (number of calls to record).
resilience4j.circuitbreaker.instances.inventory.sliding-window-size=10 
# The failure rate threshold in percentage. If 50% of calls fail, the circuit opens.
resilience4j.circuitbreaker.instances.inventory.failure-rate-threshold=50 
# The time to wait before transitioning from OPEN to HALF_OPEN state.
resilience4j.circuitbreaker.instances.inventory.wait-duration-in-open-state=5s
# The number of permitted calls when the circuit is in HALF_OPEN state.
resilience4j.circuitbreaker.instances.inventory.permitted-number-of-calls-in-half-open-state=3
# Automatically transitions to HALF_OPEN state after the wait duration, without waiting for a call.
resilience4j.circuitbreaker.instances.inventory.automatic-transition-from-open-to-half-open-enabled=true 

# circuit breaker by default will start evaluate the rate-threshold till arrives the windows size of 10
# so we don't want that we want it to start considering the record from 5
resilience4j.circuitbreaker.instances.inventory.minimum-number-of-calls=5

# Only count 5xx and connection errors as failures.
# 4xx (client/business errors like "Insufficient inventory") are NOT failures — ignore them.
resilience4j.circuitbreaker.instances.inventory.ignore-exceptions=org.springframework.web.client.HttpClientErrorException

# Aspect Order: lower number = outer (executes first).
# CircuitBreaker (1) wraps Retry (2) wraps the actual call.
# This way: 1 failed request with 3 retries = 1 failure in the circuit breaker (not 3).
resilience4j.circuitbreaker.circuit-breaker-aspect-order=1
resilience4j.retry.retry-aspect-order=2

# Resilience4j Timeout Properties:
# Limits how long your service waits for a response from another service.
resilience4j.timelimiter.instances.inventory.timeout-duration=100s

# Resilience4j Retry Properties:
# how many time res will retry to resend the request to the target service. after failing :
resilience4j.retry.instances.inventory.max-attempts=3
# the delay time between retries.
resilience4j.retry.instances.inventory.wait-duration=2s
