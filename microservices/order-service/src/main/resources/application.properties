spring.application.name=order-service

# Let Hibernate manage the database schema for development.
# It will create or update tables based on your @Entity classes.
spring.jpa.hibernate.ddl-auto=none


spring.datasource.url=jdbc:mysql://localhost:3306/order_service
spring.datasource.username=root
spring.datasource.password=mysql

server.port=8081
inventory.url=http://localhost:8082/api/inventory/
inventory.basepath=/api/inventory/
inventory.serverPort=8082
inventory.serverHost=localhost

# =====================================================
# Eureka Client Configuration
# =====================================================

# URL of the Eureka Server where this service will register itself.
# The service will send heartbeats to this server to indicate it's alive.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Use IP address instead of hostname when registering with Eureka.
# Recommended for Docker/container environments and cross-network communication.
eureka.instance.prefer-ip-address=true


management.endpoints.web.exposure.include=health,info,metrics,loggers,mappings
management.endpoint.health.show-details=always


