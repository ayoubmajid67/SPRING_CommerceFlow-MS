spring.application.name=product-service

# Explicit MongoDB configuration
spring.mongodb.uri=mongodb://product-user:apppassword@localhost:27017/product-service?authSource=admin
# Disable MongoDB health check
management.health.mongodb.enabled=false

# =====================================================
# Eureka Client Configuration
# =====================================================

# URL of the Eureka Server where this service will register itself.
# The service will send heartbeats to this server to indicate it's alive.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Use IP address instead of hostname when registering with Eureka.
# Recommended for Docker/container environments and cross-network communication.
eureka.instance.prefer-ip-address=true


management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always



