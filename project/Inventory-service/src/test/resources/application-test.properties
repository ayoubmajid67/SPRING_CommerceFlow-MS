# ? Disable Flyway for tests - use only Hibernate DDL
# This prevents schema conflicts between Flyway migrations and Hibernate entity DDL
spring.flyway.enabled=false

# ? Disable Eureka for tests
spring.cloud.discovery.enabled=false
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# ? Database configuration
spring.datasource.url=jdbc:mysql://localhost:3307/inventory_service
spring.datasource.username=inventory_user
spring.datasource.password=inventory_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ? JPA/Hibernate - Create schema from entities
spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.format_sql=true
spring.jpa.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false

# ? Server port
server.port=8082

